[sdl]
fullscreen = on

[dosbox]
machine = svga_s3
memsize = 16
startup_verbosity = quiet

[cpu]
core = dynamic
cpu_cycles = 3000
cpu_cycles_protected = 100000
cpu_throttle = on

[mixer]
blocksize = 2048
prebuffer = 50

[sblaster]
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
hdma = 5

[joystick]
joysticktype = 2axis
timed = off
deadzone = 10
