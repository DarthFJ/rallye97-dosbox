[sdl]
fullscreen = off

[dosbox]
machine = svga_s3
memsize = 16
startup_verbosity = quiet

[cpu]
core = auto
cpu_cycles = 3000
cpu_cycles_protected = 3000

[sblaster]
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
hdma = 5

[autoexec]
mount c hdd
imgmount d RALLYE97.CUE -t iso
c:
cd \rallyc\mss
setsound
exit
